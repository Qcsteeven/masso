[project]
name = "masso-backend"
version = "0.1.0"
description = "МАССО backend"
requires-python = ">=3.13"
dependencies = [
    "aiodocker>=0.27.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "langgraph>=1.2.15",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "B008", "RUF012", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"migrations/**" = ["E501", "RUF100"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL (TEST_DATABASE_URL)",
    "docker: needs a Docker daemon and the sandbox image",
]
addopts = "-q"
