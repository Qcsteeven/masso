name: masso

services:
  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masso}
      POSTGRES_DB: ${POSTGRES_DB:-masso}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masso} -d ${POSTGRES_DB:-masso}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-masso}:${POSTGRES_PASSWORD:-masso}@db:5432/${POSTGRES_DB:-masso}
      APP_ENV: ${APP_ENV:-prod}
    volumes:
      # The backend manages sandbox containers through the host Docker daemon (Sandbox Manager).
      # The socket is never mounted into sandboxes (spec §7). Run the stand on a dedicated VM (ТЗ 4.11).
      - /var/run/docker.sock:/var/run/docker.sock
      - snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  snapshots:
  ollama:
