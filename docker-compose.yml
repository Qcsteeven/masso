name: masso

services:
  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masso}
      POSTGRES_DB: ${POSTGRES_DB:-masso}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masso} -d ${POSTGRES_DB:-masso}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-masso}:${POSTGRES_PASSWORD:-masso}@db:5432/${POSTGRES_DB:-masso}
      APP_ENV: ${APP_ENV:-prod}
    volumes:
      # The backend manages sandbox containers through the host Docker daemon (Sandbox Manager).
      # The socket is never mounted into sandboxes (spec §7). Run the stand on a dedicated VM (ТЗ 4.11).
      - /var/run/docker.sock:/var/run/docker.sock
      - snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # GigaChat through the OpenAI-compatible proxy gpt2giga (OAuth token refresh, model mapping).
  # Enable: COMPOSE_PROFILES=gigachat in .env, LLM_EXTERNAL_BASE_URL=http://gpt2giga:8090/v1.
  # The port is not published: only the backend reaches it inside the compose network.
  gpt2giga:
    profiles: ["gigachat"]
    image: ghcr.io/ai-forever/gpt2giga:0.3.0
    environment:
      GPT2GIGA_MODE: PROD
      GPT2GIGA_HOST: 0.0.0.0
      GPT2GIGA_PORT: "8090"
      GPT2GIGA_ENABLE_API_KEY_AUTH: "True"
      GPT2GIGA_API_KEY: ${LLM_EXTERNAL_API_KEY:-}
      GPT2GIGA_PASS_MODEL: "True"
      GPT2GIGA_CORS_ALLOW_ORIGINS: "[]"
      # GigaChat for individuals (GIGACHAT_API_PERS) serves one request at a time and answers 429 otherwise:
      # the proxy queues requests per model; a request waiting longer falls back to the template mode
      GPT2GIGA_MODEL_MAX_CONNECTIONS_DEFAULT: ${GIGACHAT_MAX_CONCURRENCY:-1}
      GPT2GIGA_MODEL_MAX_CONNECTIONS_ACQUIRE_TIMEOUT: "45"
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${LLM_EXTERNAL_CHAT_MODEL:-GigaChat-2}
      # test mode only (ТЗ 4.9, DEVIATIONS Д-33); operation mode turns it on in docker-compose.tls.yml
      GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-True}
    restart: unless-stopped

volumes:
  pgdata:
  snapshots:
  ollama:
