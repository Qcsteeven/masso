<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МАССО</title>
    <script>
      // theme before the first paint (src/theme.ts keeps it in sync)
      try {
        var t = localStorage.getItem("masso-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages demo: 404.html saved a deep link before redirecting here; restore it before the router starts.
      try {
        var p = sessionStorage.getItem("masso-demo-path");
        if (p) { sessionStorage.removeItem("masso-demo-path"); history.replaceState(null, "", p); }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
