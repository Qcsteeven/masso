[unix_http_server]
file=/srv/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/srv/log/supervisord.log
pidfile=/srv/run/supervisord.pid
childlogdir=/srv/log
user=student

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///srv/run/supervisor.sock

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /srv/pgdata
priority=10
autorestart=true
startsecs=3
stdout_logfile=/srv/log/postgresql.log
redirect_stderr=true
stopsignal=INT

[program:store-api]
command=/usr/bin/python3 /srv/app/store_api.py
directory=/srv/app
priority=20
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/srv/log/store-api.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /srv/nginx/nginx.conf -g "daemon off;"
priority=30
autorestart=true
startsecs=1
stdout_logfile=/srv/log/nginx.log
redirect_stderr=true
