worker_processes 1;
pid /srv/run/nginx.pid;
error_log /srv/log/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log /srv/log/nginx-access.log;
    client_body_temp_path /srv/nginx/tmp/body;
    proxy_temp_path /srv/nginx/tmp/proxy;
    fastcgi_temp_path /srv/nginx/tmp/fastcgi;
    uwsgi_temp_path /srv/nginx/tmp/uwsgi;
    scgi_temp_path /srv/nginx/tmp/scgi;
    include /srv/nginx/store.conf;
}
