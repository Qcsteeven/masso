# Интернет-магазин: обратный прокси к приложению store-api
upstream store_api {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name shop.local;

    location / {
        proxy_pass http://store_api;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
